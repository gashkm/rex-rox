<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Dulaney student callout</title>
  <desc id="desc">Angled Dulaney student text with a curved black arrow pointing down and to the right.</desc>

  <g fill="#000000">
    <text x="145" y="88"
          font-family="Arial, Helvetica, sans-serif"
          font-size="64"
          font-style="italic"
          font-weight="400"
          text-anchor="middle"
          transform="rotate(13 145 88)">
      <tspan x="145" dy="0">Dulaney</tspan>
      <tspan x="145" dy="58">student</tspan>
    </text>
  </g>

  <path d="M 300 120
           C 410 142, 500 220, 528 322"
        fill="none"
        stroke="#000000"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M 470 281
           L 530 328
           L 557 251"
        fill="none"
        stroke="#000000"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
